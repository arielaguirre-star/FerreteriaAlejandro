<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferretería Alejandro - Catálogo de Productos</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#f97316', 600: '#ea580c' },
            industrial: { 800: '#1e293b', 900: '#0f172a' }
          }
        }
      }
    }
  </script>
  
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    .swiper-button-next, .swiper-button-prev {
      color: #f97316 !important;
      transform: scale(0.6);
    }
    .swiper-pagination-bullet-active {
      background: #f97316 !important;
    }
    .swiper-slide {
      height: auto !important;
    }
  </style>
</head>
<body class="h-full text-slate-100 antialiased flex flex-col min-h-screen relative">

  <!-- VIDEO DE FONDO Y OVERLAY -->
  <div class="fixed inset-0 w-full h-full overflow-hidden -z-10">
    <video autoplay loop muted playsinline class="absolute min-w-full min-h-full w-auto h-auto top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 object-cover">
      <source src="video-fondo.mp4" type="video/mp4">
    </video>
    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm"></div>
  </div>

  <!-- Header -->
  <header class="bg-industrial-900/90 backdrop-blur-md border-b border-slate-800 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <div class="bg-brand-500 text-white p-2 rounded-xl shadow-md">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6a2 2 0 012-2h4zm0 0R0 012 2v14a2 2 0 01-2 2h-4a2 2 0 01-2-2V6a2 2 0 01-2-2h4zM15 8h4a1 1 0 011 1v2a1 1 0 01-1 1h-4V8zM15 14h4a1 1 0 011 1v2a1 1 0 01-1 1h-4v-4z"></path>
            </svg>
          </div>
          <div>
            <h1 class="font-extrabold text-lg leading-none text-white tracking-wide">Ferretería Alejandro</h1>
            <p class="text-xs text-slate-400 mt-0.5">Catálogo Oficial de Productos</p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    
    <!-- CARRUSEL: ÚLTIMOS Novedades/Agregados -->
    <section id="carouselSection" class="hidden">
      <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
        Últimos Ingresos
      </h2>
      
      <div class="relative px-6">
        <div class="swiper mySwiper rounded-2xl p-2 bg-slate-900/60 backdrop-blur-md border border-slate-800">
          <div class="swiper-wrapper" id="carouselWrapper"></div>
          <div class="swiper-pagination"></div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
      </div>
    </section>

    <!-- Filtros y Búsqueda -->
    <div class="bg-slate-900/80 backdrop-blur-md p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col sm:flex-row gap-3 justify-between items-center">
      <div class="relative w-full sm:w-80">
        <input type="text" id="searchInput" placeholder="Buscar herramientas o artículos..." class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-400 focus:ring-2 focus:ring-brand-500 outline-none">
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>

      <div class="w-full sm:w-auto">
        <select id="filterCategory" class="w-full sm:w-auto px-3.5 py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-xs text-white focus:ring-2 focus:ring-brand-500 outline-none">
          <option value="">Todas las categorías</option>
          <option value="Herramientas Eléctricas">Herramientas Eléctricas</option>
          <option value="Herramientas Manuales">Herramientas Manuales</option>
          <option value="Plomería / Fontanería">Plomería / Fontanería</option>
          <option value="Pinturas & Selladores">Pinturas & Selladores</option>
          <option value="Tornillería & Fijación">Tornillería & Fijación</option>
          <option value="Electricidad">Electricidad</option>
          <option value="Jardinería">Jardinería</option>
        </select>
      </div>
    </div>

    <!-- Malla Principal: Todos los Productos -->
    <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div class="col-span-full text-center py-12 text-slate-400 text-sm">Cargando productos...</div>
    </div>
  </main>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import Swiper from 'https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.mjs';

    const DEFAULT_IMG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
    
    let todosLosProductos = [];
    let swiperInstance = null;

    function renderCarousel() {
      const carouselSection = document.getElementById('carouselSection');
      const wrapper = document.getElementById('carouselWrapper');

      if (swiperInstance) {
        swiperInstance.destroy(true, true);
        swiperInstance = null;
      }

      wrapper.innerHTML = '';

      if (!todosLosProductos || todosLosProductos.length === 0) {
        carouselSection.classList.add('hidden');
        return;
      }

      carouselSection.classList.remove('hidden');

      // Ordenar productos por fecha de creación si existe (creadoEn) o tomar los últimos 5 del arreglo
      const copiaProductos = [...todosLosProductos];
      copiaProductos.sort((a, b) => new Date(b.creadoEn || 0) - new Date(a.creadoEn || 0));
      const ultimos5 = copiaProductos.slice(0, 5);

      wrapper.innerHTML = ultimos5.map(p => {
        const titulo = p.nombre || p.titulo || 'Producto sin nombre';
        const precio = p.precio ? `$${Number(p.precio).toLocaleString('es-AR', { minimumFractionDigits: 2 })}` : 'Consultar';
        const fotos = p.imagenes || (p.imagen ? [p.imagen] : [DEFAULT_IMG]);
        const portada = fotos[0];

        return `
          <div class="swiper-slide">
            <div class="bg-slate-900/90 rounded-xl border border-slate-800 overflow-hidden h-full flex flex-col justify-between p-3 shadow-lg hover:border-brand-500/40 transition">
              <div class="h-40 bg-slate-950/60 rounded-lg overflow-hidden flex items-center justify-center p-2 mb-3 relative">
                <span class="absolute top-2 left-2 bg-brand-500 text-white text-[8px] font-black uppercase px-2 py-0.5 rounded">Nuevo</span>
                <img src="${portada}" alt="${titulo}" class="max-h-full max-w-full object-contain" onerror="this.src='${DEFAULT_IMG}'">
                ${p.categoria ? `<span class="absolute top-2 right-2 bg-slate-950/90 text-white text-[9px] font-semibold px-2 py-0.5 rounded-full border border-slate-700">${p.categoria}</span>` : ''}
              </div>
              <div class="space-y-1">
                <h4 class="font-bold text-white text-xs line-clamp-1">${titulo}</h4>
                <p class="text-sm font-black text-brand-500">${precio}</p>
              </div>
              <a href="https://wa.me/?text=Hola%20Ferreter%C3%ADa%20Alejandro,%20me%20interesa%20el%20producto:%20${encodeURIComponent(titulo)}" target="_blank" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-lg text-[11px] font-bold text-center block transition">
                Consultar
              </a>
            </div>
          </div>
        `;
      }).join('');

      swiperInstance = new Swiper(".mySwiper", {
        slidesPerView: 1,
        spaceBetween: 16,
        loop: false,
        autoplay: {
          delay: 3500,
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        breakpoints: {
          640: { slidesPerView: 2 },
          768: { slidesPerView: 3 },
          1024: { slides
