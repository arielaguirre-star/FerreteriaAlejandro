<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ferretería - Catálogo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f4f9; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-body { padding: 15px; }
    .price { font-size: 1.2rem; color: #2e7d32; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Catálogo de Productos</h1>
  <div class="grid" id="catalogo">Cargando...</div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    async function cargarProductos() {
      const querySnapshot = await getDocs(collection(db, "productos"));
      const contenedor = document.getElementById('catalogo');
      contenedor.innerHTML = '';

      querySnapshot.forEach((doc) => {
        const p = doc.data();
        contenedor.innerHTML += `
          <div class="card">
            <img src="${p.imagen}" alt="${p.titulo}">
            <div class="card-body">
              <h3>${p.titulo}</h3>
              <div class="price">$${p.precio}</div>
              <p>${p.descripcion}</p>
            </div>
          </div>
        `;
      });
    }

    cargarProductos();
  </script>
</body>
</html>
