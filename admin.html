<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Ferretería Alejandro</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#f97316', 600: '#ea580c' },
            industrial: { 800: '#1e293b', 900: '#0f172a' }
          }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="h-full text-slate-100 antialiased flex flex-col min-h-screen relative bg-slate-900">

  <!-- VIDEO DE FONDO -->
  <div class="fixed inset-0 w-full h-full overflow-hidden z-0">
    <video autoplay loop muted playsinline class="absolute min-w-full min-h-full w-auto h-auto top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 object-cover opacity-20">
      <source src="video.mp4" type="video/mp4">
    </video>
    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm"></div>
  </div>

  <!-- PANTALLA DE LOGIN CON FIREBASE AUTH -->
  <div id="loginOverlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/95">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6 relative z-10">
      <div class="text-center space-y-1">
        <div class="inline-flex bg-brand-500/20 text-brand-500 p-3 rounded-2xl mb-2">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        <h2 class="text-xl font-black text-white">Acceso Administrador</h2>
        <p class="text-xs text-slate-400">Autenticación con Firebase Auth</p>
      </div>

      <form id="loginForm" class="space-y-4" onsubmit="return false;">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Correo Electrónico *</label>
          <input type="email" id="loginEmail" required placeholder="admin@ferreteria.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white outline-none focus:ring-2 focus:ring-brand-500">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Contraseña *</label>
          <input type="password" id="loginPass" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white outline-none focus:ring-2 focus:ring-brand-500">
        </div>

        <button type="button" id="btnLogin" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 rounded-xl shadow-lg transition text-xs uppercase tracking-wider cursor-pointer">
          Ingresar al Panel
        </button>
      </form>
    </div>
  </div>

  <!-- PANEL DE ADMINISTRACIÓN PRINCIPAL -->
  <div id="adminPanel" class="hidden flex-col min-h-screen relative z-10">
    <header class="bg-industrial-900/90 backdrop-blur-md border-b border-slate-800 text-white shadow-md sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center space-x-3">
            <div class="bg-brand-500 text-white p-2 rounded-xl shadow-md">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <div>
              <h1 class="font-extrabold text-lg leading-none text-white">Ferretería Alejandro</h1>
              <p class="text-xs text-slate-400 mt-0.5">Gestión de Catálogo Cloud</p>
            </div>
          </div>

          <button id="btnLogout" class="px-3.5 py-1.5 bg-red-600/80 hover:bg-red-600 text-white text-xs font-bold rounded-lg transition">
            Cerrar Sesión
          </button>
        </div>
      </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Formulario de carga -->
        <section class="lg:col-span-5 bg-slate-900/90 backdrop-blur-md p-6 rounded-2xl border border-slate-800 shadow-xl sticky top-20">
          <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-800">
            <h3 id="formTitle" class="text-lg font-bold text-white flex items-center">
              <svg class="w-5 h-5 text-brand-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              Nuevo Producto
            </h3>
            <button id="btnCancelEdit" class="hidden text-xs text-red-500 font-bold underline">Cancelar Edición</button>
          </div>

          <form id="formProducto" class="space-y-4" onsubmit="return false;">
            <input type="hidden" id="productId">

            <div>
              <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nombre del Producto *</label>
              <input type="text" id="prodNombre" required placeholder="Ej. Amoladora Angular 850W" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Categoría *</label>
                <select id="prodCategoria" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white outline-none focus:ring-2 focus:ring-brand-500">
                  <option value="Herramientas Eléctricas">Herramientas Eléctricas</option>
                  <option value="Herramientas Manuales">Herramientas Manuales</option>
                  <option value="Plomería / Fontanería">Plomería / Fontanería</option>
                  <option value="Pinturas & Selladores">Pinturas & Selladores</option>
                  <option value="Tornillería & Fijación">Tornillería & Fijación</option>
                  <option value="Electricidad">Electricidad</option>
                  <option value="Jardinería">Jardinería</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Precio ($) *</label>
                <input type="number" id="prodPrecio" step="0.01" min="0" required placeholder="0.00" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white outline-none focus:ring-2 focus:ring-brand-500">
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Descripción</label>
              <textarea id="prodDescripcion" rows="2" placeholder="Detalles técnicos..." class="w-full px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white outline-none focus:ring-2 focus:ring-brand-500"></textarea>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="block text-xs font-semibold uppercase text-slate-400">Imágenes (Subida Directa a GitHub)</label>
                <span class="text-[11px] text-brand-500 font-bold" id="imageCountLabel">0 seleccionadas</span>
              </div>
              
              <div class="relative border-2 border-dashed border-slate-700 rounded-xl p-4 text-center hover:border-brand-500 bg-slate-800/50 transition cursor-pointer">
                <input type="file" id="prodFotosInput" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                <svg class="mx-auto h-7 w-7 text-slate-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="text-xs text-slate-300 font-semibold">Seleccionar imágenes</p>
              </div>

              <div id="imagesPreviewGrid" class="grid grid-cols-4 gap-2 mt-3 max-h-48 overflow-y-auto p-1"></div>
            </div>

            <button type="button" id="btnSaveProduct" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 rounded-xl shadow transition text-xs uppercase tracking-wider cursor-pointer">
              <span id="btnSaveText">Guardar Producto en Firebase</span>
            </button>
          </form>
        </section>

        <!-- Grilla de productos guardados con Buscador -->
        <section class="lg:col-span-7 space-y-4">
          <div class="bg-slate-900/90 backdrop-blur-md p-4 rounded-2xl border border-slate-800 shadow-xl flex items-center justify-between gap-3">
            <div class="relative w-full">
              <input type="text" id="adminSearchInput" placeholder="Buscar producto guardado por nombre..." class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-400 focus:ring-2 focus:ring-brand-500 outline-none transition">
              <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
              </svg>
            </div>
            <span id="adminProductCount" class="text-xs text-slate-400 font-semibold whitespace-nowrap">0 productos</span>
          </div>

          <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </section>

      </div>
    </main>
  </div>

  <!-- SCRIPT CON FIREBASE Y SUBIDA DIRECTA A GITHUB API -->
  <script type="module">
    import { db, auth } from './firebase-config.js';
    import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // DATOS DE CONFIGURACIÓN DE TU REPOSITORIO GITHUB
    const GITHUB_USER = "arielaguirre-star";       // Ej: ferreteriaalejandro
    const GITHUB_REPO = "FerreteriaAlejandro";       // Ej: ferreteria-web
    const GITHUB_TOKEN = "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";        // Pega tu Personal Access Token (ghp_...)
    const DEFAULT_IMG = "https://via.placeholder.com/300x300/0f172a/ffffff?text=Sin+Imagen";

    let productos = [];
    let selectedImages = [];
    let isEditing = false;

    // Escuchar estado del login
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('flex');
      } else {
        document.getElementById('loginOverlay').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
      }
    });

    // Iniciar Sesión
    document.getElementById('btnLogin').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      if (!email || !pass) return alert("Ingrese usuario y contraseña.");

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (error) {
        alert("Error de inicio de sesión: " + error.message);
      }
    });

    // Cerrar Sesión
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await signOut(auth);
    });

    // COMPRESIÓN DE IMAGEN A BASE64
    function compressImageToBase64(file, maxWidth = 1200, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height && width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            } else if (height > maxWidth) {
              width = Math.round((width * maxWidth) / height);
              height = maxWidth;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64Content = dataUrl.split(',')[1];
            resolve(base64Content);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    // SUBIDA FÍSICA A LA API DE GITHUB
    async function uploadImageToGitHubAPI(file) {
      if (!GITHUB_TOKEN || GITHUB_TOKEN.includes("TU_TOKEN")) {
        throw new Error("Por favor configura tu token de GitHub en la constante GITHUB_TOKEN.");
      }

      const base64Content = await compressImageToBase64(file);
      const nombreLimpio = Date.now() + '_' + file.name.toLowerCase().replace(/\s+/g, '-');
      const filePath = `assets/productos/${nombreLimpio}`;
      const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${filePath}`;

      const response = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${GITHUB_TOKEN}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
          message: `Carga automatica de imagen: ${nombreLimpio}`,
          content: base64Content
        })
      });

      if (response.ok) {
        return filePath;
      } else {
        const errorData = await response.json();
        throw new Error(errorData.message || "Error al subir a GitHub API");
      }
    }

    // Escuchar Firestore en tiempo real
    onSnapshot(collection(db, "productos"), (snapshot) => {
      productos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderProducts();
    });

    document.getElementById('adminSearchInput').addEventListener('input', renderProducts);

    // Selección de imágenes locales
    document.getElementById('prodFotosInput').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      for (let file of files) {
        selectedImages.push({ 
          id: 'img_' + Date.now() + Math.random(), 
          file: file, 
          previewUrl: URL.createObjectURL(file),
          url: null 
        });
      }
      renderPreviews();
    });

    function renderPreviews() {
      const grid = document.getElementById('imagesPreviewGrid');
      document.getElementById('imageCountLabel').textContent = `${selectedImages.length} seleccionadas`;
      grid.innerHTML = selectedImages.map(img => `
        <div class="relative aspect-square rounded-xl overflow-hidden border border-slate-700 bg-slate-950">
          <img src="${img.url || img.previewUrl}" class="w-full h-full object-cover">
          <button type="button" onclick="removeImage('${img.id}')" class="absolute top-1 right-1 p-1 bg-red-600 text-white rounded-lg shadow">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      `).join('');
    }

    window.removeImage = (id) => {
      selectedImages = selectedImages.filter(i => i.id !== id);
      renderPreviews();
    };

    // Guardar Producto en Firestore y subir imagen a GitHub vía API
    document.getElementById('btnSaveProduct').addEventListener('click', async () => {
      const id = document.getElementById('productId').value;
      const nombre = document.getElementById('prodNombre').value.trim();
      const categoria = document.getElementById('prodCategoria').value;
      const precio = parseFloat(document.getElementById('prodPrecio').value);
      const descripcion = document.getElementById('prodDescripcion').value.trim();

      if (!nombre || isNaN(precio)) return alert('Por favor complete los campos obligatorios (*)');

      const btnText = document.getElementById('btnSaveText');
      const btn = document.getElementById('btnSaveProduct');
      btn.disabled = true;

      try {
        const fotosUrls = [];

        for (let i = 0; i < selectedImages.length; i++) {
          const img = selectedImages[i];
          if (img.url && (img.url.startsWith('assets/') || img.url.startsWith('http'))) {
            fotosUrls.push(img.url);
          } else if (img.file) {
            btnText.textContent = `Subiendo directamente a GitHub ${i + 1} de ${selectedImages.length}...`;
            const localPath = await uploadImageToGitHubAPI(img.file);
            fotosUrls.push(localPath);
          }
        }

        btnText.textContent = "Guardando en Firestore...";

        const productoData = {
          nombre,
          categoria,
          precio,
          descripcion,
          imagenes: fotosUrls.length > 0 ? fotosUrls : [DEFAULT_IMG],
          actualizadoEn: new Date().toISOString()
        };

        if (isEditing && id) {
          await updateDoc(doc(db, "productos", id), productoData);
          alert("¡Producto e imagen subidos y actualizados automáticamente en GitHub!");
        } else {
          productoData.creadoEn = new Date().toISOString();
          await addDoc(collection(db, "productos"), productoData);
          alert("¡Producto e imagen creados automáticamente en GitHub Pages!");
        }

        resetForm();
      } catch (err) {
        console.error("Error en la operación:", err);
        alert("Ocurrió un error: " + err.message);
      } finally {
        btn.disabled = false;
        btnText.textContent = "Guardar Producto en Firebase";
      }
    });

    function renderProducts() {
      const query = document.getElementById('adminSearchInput').value.toLowerCase().trim();
      const grid = document.getElementById('productsGrid');
      const countLabel = document.getElementById('adminProductCount');

      const filtrados = productos.filter(p => {
        const nombre = (p.nombre || p.titulo || '').toLowerCase();
        return nombre.includes(query);
      });

      countLabel.textContent = `${filtrados.length} productos`;

      if (filtrados.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500 text-xs">No se encontraron productos.</div>`;
        return;
      }

      grid.innerHTML = filtrados.map(p => `
        <div class="bg-slate-900/80 rounded-2xl border border-slate-800 p-4 space-y-2">
          <div class="flex items-center space-x-3">
            <img src="${(p.imagenes && p.imagenes[0]) ? p.imagenes[0] : DEFAULT_IMG}" class="w-12 h-12 object-cover rounded-lg border border-slate-700 bg-slate-950" onerror="this.src='${DEFAULT_IMG}'">
            <div>
              <h4 class="font-bold text-white text-sm line-clamp-1">${p.nombre || p.titulo}</h4>
              <p class="text-xs text-brand-500 font-extrabold">$${p.precio}</p>
            </div>
          </div>
          <div class="flex justify-end space-x-2 pt-2 border-t border-slate-800/60">
            <button onclick="editProduct('${p.id}')" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-lg transition">Editar</button>
            <button onclick="deleteProduct('${p.id}')" class="px-3 py-1 bg-red-900/50 hover:bg-red-900 text-red-400 text-xs font-bold rounded-lg transition">Eliminar</button>
          </div>
        </div>
      `).join('');
    }

    window.editProduct = (id) => {
      const p = productos.find(x => x.id === id);
      if (!p) return;
      isEditing = true;
      document.getElementById('formTitle').textContent = 'Editar Producto';
      document.getElementById('btnCancelEdit').classList.remove('hidden');
      document.getElementById('productId').value = p.id;
      document.getElementById('prodNombre').value = p.nombre || p.titulo;
      document.getElementById('prodCategoria').value = p.categoria || 'Herramientas Manuales';
      document.getElementById('prodPrecio').value = p.precio;
      document.getElementById('prodDescripcion').value = p.descripcion || '';
      selectedImages = (p.imagenes || [DEFAULT_IMG]).map((url, i) => ({ id: 'ex_' + i, url, file: null, previewUrl: url }));
      renderPreviews();
    };

    document.getElementById('btnCancelEdit').addEventListener('click', resetForm);

    window.deleteProduct = async (id) => {
      if (confirm('¿Eliminar este producto permanentemente?')) {
        await deleteDoc(doc(db, "productos", id));
      }
    };

    function resetForm() {
      isEditing = false;
      document.getElementById('formTitle').textContent = 'Nuevo Producto';
      document.getElementById('btnCancelEdit').classList.add('hidden');
      document.getElementById('productId').value = '';
      document.getElementById('formProducto').reset();
      selectedImages = [];
      renderPreviews();
    }
  </script>
</body>
</html>
