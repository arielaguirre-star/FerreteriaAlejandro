<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin Ferretería</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f0f2f5; padding: 20px; }
    .box { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; }
    input, textarea, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    button { background: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; }
    #panelAdmin { display: none; }
  </style>
</head>
<body>

  <!-- Formulario de Login -->
  <div class="box" id="loginBox">
    <h2>Iniciar Sesión (Admin)</h2>
    <input type="email" id="email" placeholder="Correo electrónico">
    <input type="password" id="password" placeholder="Contraseña">
    <button id="btnLogin">Entrar</button>
  </div>

  <!-- Formulario de Carga de Producto -->
  <div class="box" id="panelAdmin">
    <h2>Nuevo Producto</h2>
    <input type="text" id="titulo" placeholder="Nombre del producto">
    <input type="number" id="precio" placeholder="Precio ($)">
    <textarea id="descripcion" placeholder="Descripción"></textarea>
    
    <label style="margin-top:10px; display:block; font-weight:bold;">Foto del Producto:</label>
    <input type="file" id="fotoFile" accept="image/*">

    <button id="btnGuardar">Guardar Producto</button>
    <p id="status"></p>
  </div>

  <script type="module">
    import { auth, db, storage } from './firebase-config.js';
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Manejar Login
    document.getElementById('btnLogin').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        alert("Error de autenticación: " + err.message);
      }
    });

    // Detectar estado de la sesión
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('panelAdmin').style.display = 'block';
      }
    });

    document.getElementById('btnGuardar').addEventListener('click', async () => {
  const status = document.getElementById('status');
  const titulo = document.getElementById('titulo').value.trim();
  const precio = parseFloat(document.getElementById('precio').value);
  const descripcion = document.getElementById('descripcion').value.trim();
  const fileInput = document.getElementById('fotoFile');

  if (!titulo || isNaN(precio) || fileInput.files.length === 0) {
    status.style.color = 'red';
    status.innerText = "Completa título, precio y selecciona una imagen.";
    return;
  }

  try {
    status.style.color = 'blue';
    status.innerText = "Comprimiendo imagen...";

    // 1. COMPRESIÓN: Redimensiona a máx 800px de ancho y convierte a WebP al 75% de calidad
    const fotoOriginal = fileInput.files[0];
    const fotoComprimidaBlob = await comprimirImagen(fotoOriginal, 800, 0.75);

    status.innerText = "Subiendo imagen comprimida a ImgBB...";

    // 2. Preparar el Blob comprimido para enviarlo a ImgBB
    const formData = new FormData();
    formData.append('image', fotoComprimidaBlob, `${Date.now()}.webp`);

    const resImgBB = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
      method: 'POST',
      body: formData
    });

    const dataImgBB = await resImgBB.json();

    if (!dataImgBB.success) {
      throw new Error("Error al subir la imagen a ImgBB.");
    }

    const imagenUrl = dataImgBB.data.url;

    // 3. Guardar el producto en Firestore con la URL recibida
    status.innerText = "Guardando en la base de datos...";
    await addDoc(collection(db, "productos"), {
      titulo,
      precio,
      descripcion,
      imagen: imagenUrl,
      creado: Date.now()
    });

    status.style.color = 'green';
    status.innerText = "¡Producto guardado exitosamente!";

    // Limpiar campos
    document.getElementById('titulo').value = '';
    document.getElementById('precio').value = '';
    document.getElementById('descripcion').value = '';
    fileInput.value = '';

  } catch (err) {
    status.style.color = 'red';
    status.innerText = err.message;
  }
});
  </script>
</body>
</html>
