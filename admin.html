<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Ferretería Alejandro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#f97316', 600: '#ea580c' },
            industrial: { 800: '#1e293b', 900: '#0f172a' }
          }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col min-h-screen">

  <header class="bg-industrial-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <div class="bg-brand-500 text-white p-2 rounded-xl shadow-md">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6a2 2 0 012-2h4zm0 0R0 012 2v14a2 2 0 01-2 2h-4a2 2 0 01-2-2V6a2 2 0 01-2-2h4zM15 8h4a1 1 0 011 1v2a1 1 0 01-1 1h-4V8zM15 14h4a1 1 0 011 1v2a1 1 0 01-1 1h-4v-4z"></path>
            </svg>
          </div>
          <div>
            <h1 class="font-extrabold text-lg leading-none text-white">Ferretería Alejandro</h1>
            <p class="text-xs text-slate-400 mt-0.5">Gestión de Catálogo Cloud</p>
          </div>
        </div>

        <a href="index.html" class="inline-flex items-center px-3.5 py-1.5 border border-slate-700 hover:border-brand-500 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg text-slate-200 transition">
          Ver Catálogo Público
        </a>
      </div>
    </div>
  </header>

  <div id="toastContainer" class="fixed top-20 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Columna Formulario -->
      <section class="lg:col-span-5 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm sticky top-20">
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
          <h3 id="formTitle" class="text-lg font-bold text-slate-900 flex items-center">
            <svg class="w-5 h-5 text-brand-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Nuevo Producto
          </h3>
          <button id="btnCancelEdit" class="hidden text-xs text-red-600 hover:text-red-700 font-bold underline">
            Cancelar Edición
          </button>
        </div>

        <form id="formProducto" class="space-y-4" onsubmit="return false;">
          <input type="hidden" id="productId">

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nombre del Producto *</label>
            <input type="text" id="prodNombre" required placeholder="Ej. Amoladora Angular 850W" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none text-xs">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Categoría *</label>
              <select id="prodCategoria" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none text-xs bg-white">
                <option value="Herramientas Eléctricas">Herramientas Eléctricas</option>
                <option value="Herramientas Manuales">Herramientas Manuales</option>
                <option value="Plomería / Fontanería">Plomería / Fontanería</option>
                <option value="Pinturas & Selladores">Pinturas & Selladores</option>
                <option value="Tornillería & Fijación">Tornillería & Fijación</option>
                <option value="Electricidad">Electricidad</option>
                <option value="Jardinería">Jardinería</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Precio ($) *</label>
              <input type="number" id="prodPrecio" step="0.01" min="0" required placeholder="0.00" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none text-xs">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Descripción</label>
            <textarea id="prodDescripcion" rows="2" placeholder="Detalles o especificaciones técnicas..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none text-xs"></textarea>
          </div>

          <!-- Subida de +10 imágenes con Compresión Canvas -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-semibold uppercase text-slate-600">Imágenes (+10 simultáneas)</label>
              <span class="text-[11px] text-brand-600 font-bold" id="imageCountLabel">0 seleccionadas</span>
            </div>
            
            <div class="relative border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:border-brand-500 bg-slate-50 transition cursor-pointer">
              <input type="file" id="prodFotosInput" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
              <svg class="mx-auto h-7 w-7 text-slate-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
              <p class="text-xs text-slate-700 font-semibold">Seleccionar o soltar múltiples fotos</p>
              <p class="text-[10px] text-slate-400">Compresión HTML5 Canvas local automática</p>
            </div>

            <div id="imagesPreviewGrid" class="grid grid-cols-4 gap-2 mt-3 max-h-48 overflow-y-auto p-1"></div>
          </div>

          <button type="button" id="btnSaveProduct" class="w-full bg-industrial-800 hover:bg-industrial-900 text-white font-bold py-3 px-4 rounded-xl shadow transition flex items-center justify-center space-x-2">
            <span id="btnSaveText">Guardar Producto en Firebase</span>
          </button>
        </form>
      </section>

      <!-- Columna Grilla -->
      <section class="lg:col-span-7 space-y-4">
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </section>

    </div>
  </main>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const IMGBB_API_KEY = "3a7f82b9e1c0d4e5f6a7b8c9d0e1f2a3"; 
    const DEFAULT_IMG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;

    let productos = [];
    let selectedImages = [];
    let isEditing = false;

    // Motor de compresión Canvas en el Navegador
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            let width = img.width, height = img.height, max = 1200;
            if (width > height && width > max) { height = Math.round((height * max) / width); width = max; }
            else if (height > max) { width = Math.round((width * max) / height); height = max; }

            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            const base64 = canvas.toDataURL('image/jpeg', 0.75);
            resolve({ base64, cleanBase64: base64.replace(/^data:image\/(png|jpeg|jpg);base64,/, "") });
          };
        };
      });
    }

    // Subida a ImgBB API
    async function uploadToImgBB(cleanBase64) {
      const formData = new FormData();
      formData.append('image', cleanBase64);
      const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
      const data = await res.json();
      return data.success ? data.data.display_url : null;
    }

    // Listener Firebase Firestore en Tiempo Real
    onSnapshot(collection(db, "productos"), (snapshot) => {
      productos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderProducts();
    });

    document.getElementById('prodFotosInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      for (let file of files) {
        const comp = await compressImage(file);
        selectedImages.push({ id: 'img_' + Date.now() + Math.random(), base64: comp.base64, cleanBase64: comp.cleanBase64, url: null });
      }
      renderPreviews();
    });

    function renderPreviews() {
      const grid = document.getElementById('imagesPreviewGrid');
      document.getElementById('imageCountLabel').textContent = `${selectedImages.length} seleccionadas`;
      grid.innerHTML = selectedImages.map(img => `
        <div class="relative aspect-square rounded-xl overflow-hidden border border-slate-200">
          <img src="${img.url || img.base64}" class="w-full h-full object-cover">
          <button type="button" onclick="removeImage('${img.id}')" class="absolute top-1 right-1 p-1 bg-red-600 text-white rounded-lg">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      `).join('');
    }

    window.removeImage = (id) => {
      selectedImages = selectedImages.filter(i => i.id !== id);
      renderPreviews();
    };

    document.getElementById('btnSaveProduct').addEventListener('click', async () => {
      const id = document.getElementById('productId').value;
      const nombre = document.getElementById('prodNombre').value.trim();
      const categoria = document.getElementById('prodCategoria').value;
      const precio = parseFloat(document.getElementById('prodPrecio').value);
      const descripcion = document.getElementById('prodDescripcion').value.trim();

      if (!nombre || isNaN(precio)) return alert('Complete los campos obligatorios');

      const btnText = document.getElementById('btnSaveText');
      btnText.textContent = "Guardando...";

      try {
        const fotosUrls = [];
        for (let img of selectedImages) {
          if (img.url) {
            fotosUrls.push(img.url);
          } else if (img.cleanBase64) {
            const url = await uploadToImgBB(img.cleanBase64);
            fotosUrls.push(url || img.base64);
          }
        }

        const data = { nombre, categoria, precio, descripcion, imagenes: fotosUrls.length ? fotosUrls : [DEFAULT_IMG] };

        if (isEditing && id) {
          await updateDoc(doc(db, "productos", id), data);
        } else {
          await addDoc(collection(db, "productos"), data);
        }

        resetForm();
      } catch (err) {
        alert("Error al guardar: " + err.message);
      } finally {
        btnText.textContent = "Guardar Producto en Firebase";
      }
    });

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = productos.map(p => `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 space-y-2">
          <h4 class="font-bold text-slate-900 text-sm">${p.nombre || p.titulo}</h4>
          <p class="text-xs text-brand-600 font-extrabold">$${p.precio}</p>
          <div class="flex justify-end space-x-2 pt-2">
            <button onclick="editProduct('${p.id}')" class="px-3 py-1 bg-slate-100 text-xs font-bold rounded-lg">Editar</button>
            <button onclick="deleteProduct('${p.id}')" class="px-3 py-1 bg-red-100 text-red-600 text-xs font-bold rounded-lg">Eliminar</button>
          </div>
        </div>
      `).join('');
    }

    window.editProduct = (id) => {
      const p = productos.find(x => x.id === id);
      if (!p) return;
      isEditing = true;
      document.getElementById('productId').value = p.id;
      document.getElementById('prodNombre').value = p.nombre || p.titulo;
      document.getElementById('prodCategoria').value = p.categoria || 'Herramientas Manuales';
      document.getElementById('prodPrecio').value = p.precio;
      document.getElementById('prodDescripcion').value = p.descripcion || '';
      selectedImages = (p.imagenes || [DEFAULT_IMG]).map((url, i) => ({ id: 'ex_' + i, url, base64: url }));
      renderPreviews();
    };

    window.deleteProduct = async (id) => {
      if (confirm('¿Eliminar este producto?')) await deleteDoc(doc(db, "productos", id));
    };

    function resetForm() {
      isEditing = false;
      document.getElementById('productId').value = '';
      document.getElementById('formProducto').reset();
      selectedImages = [];
      renderPreviews();
    }
  </script>
</body>
</html>
